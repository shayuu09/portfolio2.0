<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>alex he</title>
  </head>
  <body>
    <div id="content"></div>
    <script>
      // https://www.w3tutorials.net/javascript-tutorial/using-javascript-to-build-responsive/
      // https://www.tutorialspoint.com/article/how-to-include-another-html-file-in-an-html-file
      // + my own additions
      const contentDiv = document.getElementById('content');
      const initialWidth = window.innerWidth;
      resize(initialWidth);
      window.addEventListener('resize', debounce(function() {
    console.log('Resized');
      const viewportWidth = window.innerWidth;
      resize(viewportWidth);
        }, 300));
      
      function resize(viewportWidth) {
        if (viewportWidth < 1080) {
        fetch('mobile/mobile.html')
        .then(response => response.text())
        .then(html => {
          contentDiv.innerHTML = html;
        })
        .catch(error => {
          contentDiv.innerHTML = 'Error loading content';
          console.error('Error: error loading desktop version', error);
        });
      } else {
        fetch('desktop/desktop.html')
        .then(response => response.text())
        .then(html => {
          contentDiv.innerHTML = html;
        })
        .catch(error => {
          contentDiv.innerHTML = 'Error loading content';
          console.error('Error: error loading desktop version', error);
        });
      }
      }
      // Debouncing function
    function debounce(func, delay) {
    let timer;
    return function() {
        const context = this;
        const args = arguments;
        clearTimeout(timer);
        timer = setTimeout(() => {
            func.apply(context, args);
        }, delay);
    };
}

window.addEventListener('resize', debounce(function() {
    console.log('Resized');
}, 300));
      
      // Source - https://stackoverflow.com/a/69190644
      // Posted by Johannes Ewald
      // Retrieved 2026-09-29, License - CC BY-SA 4.0

function executeScriptElements(containerElement) {
  const scriptElements = containerElement.querySelectorAll("script");

  Array.from(scriptElements).forEach((scriptElement) => {
    const clonedElement = document.createElement("script");

    Array.from(scriptElement.attributes).forEach((attribute) => {
      clonedElement.setAttribute(attribute.name, attribute.value);
    });
    
    clonedElement.text = scriptElement.text;

    scriptElement.parentNode.replaceChild(clonedElement, scriptElement);
  });
}

      executeScriptElements(contentDiv);
    </script>
  </body>
</html>
